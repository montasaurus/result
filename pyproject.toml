[project]
name = "result"
description = "A Rust-like result type for Python"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [{ name = "Danilo Bargen", email = "mail@dbrgn.ch" }]
keywords = ["enum", "result", "rust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/montasaurus/result"

[dependency-groups]
dev = [
  "lazydocs>=0.4.8",
  "mypy>=1.14.1",
  "pyright",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.1",
  "pytest-mypy-plugins>=3.2.0",
  "ruff>=0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/result/__init__.py"

[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
no_implicit_reexport = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pyright]
strict = ["src/result/**"]

[tool.pytest.ini_options]
addopts = ["--tb=short"]
testpaths = ["tests"]

[tool.ruff]
extend = "ruff.default.toml"

[tool.ruff.lint]
ignore = ["unused-async"]
